name: Deploy Storybook to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm -r build

      # A GitHub Pages project site is served under /<repo>/, not /; the
      # matching Vite `base` is wired up in .storybook/main.ts, gated on
      # this env var so the local dev server and storybook:test:ci (served
      # at the root of localhost:6006) are unaffected.
      - name: Build Storybook (React)
        env:
          STORYBOOK_BASE_PATH: /${{ github.event.repository.name }}/
        run: pnpm storybook:build

      # Angular's Storybook lands in a subdirectory of the same tree, not a
      # separate deploy — GitHub Pages doesn't support two independent
      # deploy-pages calls targeting the same site. No base-path env var
      # needed here (unlike React, above): this builder's iframe.html loads
      # chunks via plain relative `import './foo.js'` specifiers, which
      # resolve correctly under any nesting depth without configuration —
      # see .storybook-angular/main.ts's webpackFinal comment.
      - name: Build Angular library
        run: pnpm build:angular-lib

      - name: Build Storybook (Angular)
        run: npx ng run loom-storybook:build-storybook --output-dir=storybook-static/angular

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: storybook-static

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
