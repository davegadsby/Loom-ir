name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm -r build

      # loom-angular-components isn't a tsc -b project (pnpm -r build skips
      # it — see its package.json), and examples/tsconfig.json's typecheck
      # below resolves its types from packages/loom-angular-components/dist/,
      # so it needs building first.
      - name: Build Angular library
        run: pnpm build:angular-lib

      # Proves the compiler's committed output is valid code. examplesUpToDate
      # only proves the output text has not changed, never that it compiles.
      - name: Typecheck generated examples
        run: pnpm typecheck:examples

      # Build-only, not a render check (see README.md's Angular Storybook
      # section) — still catches real Angular-specific compiler regressions
      # tsc alone can't (e.g. a missing standalone-component template import).
      - name: Angular Storybook build
        run: pnpm storybook:angular:build

      - name: Test
        run: pnpm test

  # Separate from build-and-test: a Storybook build + real-browser test-runner
  # cycle is meaningfully slower than the fast unit-test job above, and
  # shouldn't risk that job's speed. GitHub-hosted runners have no
  # pre-installed browser (unlike local dev, which reuses one via the
  # `playwright`/`playwright-core` pnpm.overrides pin) — `playwright install`
  # fetches one fresh here, matching whatever version that pin resolves to.
  storybook-interaction-tests:
    name: Storybook Interaction Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright's Chromium
        run: npx playwright install --with-deps chromium

      - name: Build
        run: pnpm -r build

      - name: Storybook interaction tests (real headless Chromium)
        run: pnpm run storybook:test:ci
